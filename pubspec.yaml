name: sakthi_erp
description: A professional ERP application for Sakthi Steel.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # For making HTTP API calls
  http: ^1.2.1

  # For internationalization and date formatting
  intl: ^0.19.0

  # For launching URLs (like the PDF report)
  url_launcher: ^6.3.0

  # For location services
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # For picking files from the device
  file_picker: ^8.0.5
  open_file: ^3.3.2
  dropdown_search: ^6.0.2
  
  # For PDF generation and printing
  printing: ^5.14.2
  pdf: ^3.11.0

  # Icons
  cupertino_icons: ^1.0.2
  barcode_scan2: ^4.4.1     # For barcode scanning
  permission_handler: ^11.1.0 # For handling camera permissions
  cached_network_image: ^3.4.1 # For loading and caching network images
  retry: ^3.1.2
  just_audio: ^0.10.4 
 
  flutter_sound: ^9.28.0 
  syncfusion_flutter_pdfviewer: ^31.1.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf